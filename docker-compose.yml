services:

  # ── PostgreSQL database ────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psychology_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: psychology_practice_next
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psychology_app -d psychology_practice_next"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot migration runner ──────────────────────────────
  migrate:
    build: .
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.local
    environment:
      # Override DATABASE_URL to use the Docker service name
      DATABASE_URL: postgresql://psychology_app:${DB_PASSWORD}@db:5432/psychology_practice_next
    restart: "no"

  # ── Next.js application ────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env.local
    environment:
      # Override DATABASE_URL to use the Docker service name
      DATABASE_URL: postgresql://psychology_app:${DB_PASSWORD}@db:5432/psychology_practice_next
    ports:
      - "3000:3000"
    volumes:
      # Persist user-uploaded images across container restarts
      - uploads:/app/public/uploads

# ── Named volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
  uploads:

